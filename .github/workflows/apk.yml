# ============================================================================
#  Monta o APK da casca Android do Comanda.
#
#  POR QUE ISTO EXISTE: montar APK precisa de Java + SDK do Android, que nem
#  todo micro tem instalado. Aqui quem monta e o GitHub, de graca, a cada push.
#  Voce baixa o arquivo pronto em Actions -> a execucao mais recente ->
#  "Artifacts" -> comanda-apk.
#
#  ATENCAO AO QUE ISTO **NAO** E: nao e a atualizacao do Comanda. O conteudo do
#  app (telas, relatorio, precos, correcao de bug) vem do site na Vercel e muda
#  na hora, sem passar por aqui. So mexe neste APK quem mexer na casca — na
#  ponte com a maquininha, no icone, no nome ou na permissao. Ou seja: quase
#  nunca. Por isso o gatilho abaixo so olha a pasta app-android/.
# ============================================================================
name: APK do Comanda

on:
  push:
    # A branch "maquininha" e onde a casca e a ponte sao construidas, longe do
    # que esta no ar pro bar. O "main" fica na lista so pro dia em que isso for
    # aprovado e juntado.
    branches: [main, maquininha]
    paths:
      - 'app-android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch: {}   # tambem da pra disparar na mao, pelo botao "Run workflow"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 6 pede JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Instalar as dependencias da casca
        working-directory: app-android
        run: npm ci

      # Copia o capacitor.config.json (e os plugins) pra dentro do projeto
      # Android. E o passo que carimba o endereco da Vercel no app.
      - name: Sincronizar a casca
        working-directory: app-android
        run: npx cap sync android

      # O repositorio e mexido no Windows, que nao guarda o "pode executar".
      - name: Liberar o gradlew
        working-directory: app-android/android
        run: chmod +x gradlew

      - name: Montar o APK
        working-directory: app-android/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: comanda-apk
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
